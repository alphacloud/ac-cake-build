version: .{build}

pull_requests:
  do_not_increment_build_number: true

nuget:
  disable_publish_on_pr: true

image: Visual Studio 2026

clone_folder: c:\work\ac-cake-build

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_TERMINAL_LOGGER: false
  CAKE_PATHS_TOOLS: c:\tmp\cake\tools\
  COVERALLS_REPORTER_EXE: C:\tools\coveralls-windows.exe
  COVERALLS_REPO_TOKEN:
    secure: REPLACE_WITH_ENCRYPTED_COVERALLS_TOKEN
  GITHUB_TOKEN:
    secure: REPLACE_WITH_ENCRYPTED_GITHUB_TOKEN

cache:
  - c:\tmp\cake\tools -> build\*.csproj, appveyor.yml

install:
  - ps: Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "$env:TEMP\dotnet-install.ps1"
  - ps: '& "$env:TEMP\dotnet-install.ps1" -JSonFile global.json -InstallDir "$env:ProgramFiles\dotnet"'
  - ps: dotnet --info
  - ps: New-Item -ItemType Directory -Force -Path C:\tools | Out-Null
  - ps: Invoke-WebRequest -Uri "https://github.com/coverallsapp/coverage-reporter/releases/latest/download/coveralls-windows.exe" -OutFile $env:COVERALLS_REPORTER_EXE

build_script:
  - ps: ./build.ps1

test: off

artifacts:
  - path: artifacts/packages/*.nupkg
    name: NuGet packages
  - path: artifacts/packages/*.snupkg
    name: NuGet symbol packages
    type: NuGetPackage

deploy:
  - provider: NuGet
    name: Tagged release
    api_key:
      secure: REPLACE_WITH_ENCRYPTED_NUGET_API_KEY
    on:
      appveyor_repo_tag: true
